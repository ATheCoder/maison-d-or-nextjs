services:
  postgres:
    image: postgres:18-alpine
    container_name: my-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5555:5432"
    volumes:
      # Postgres 18+ recommends mounting at /var/lib/postgresql (data lives in a
      # version-specific subdirectory). Mounting at .../data crash-loops on PG18.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
